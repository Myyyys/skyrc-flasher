[package]
name = "skyrc-flasher"
version = "1.0.0"
edition = "2024"
description = "SkyRC Smart Charger firmware flasher and updater for Linux"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }
